    <!-- The console's own preloads are injected by the server, on /twin only —
         /api/config is gone (its one value is inlined below) and the manifest
         the console actually opens is /live, not /sim. Preloading either from
         here spent the landing page's bandwidth on data it never reads.
         See routes/pages.py. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      <script>
      // Applied before first paint, so the theme is on <html> before the first
      // pixel and nobody sees a flash of the other one. Mirrors ThemeToggle's
      // rule exactly — a stored choice wins, otherwise DARK. Not the OS: the
      // cover page is designed dark, and following prefers-color-scheme made
      // the same link show a different product on different machines.
      (function () {
        try {
          var t = localStorage.getItem('ft-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
      })();
    </script>
